name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Run every example
        run: |
          for e in */; do
            [ -f "$e/main.go" ] || continue
            echo "::group::$e"
            go run "./$e"
            echo "::endgroup::"
          done

  commits:
    # Same check as scripts/hooks/commit-msg, for clones without the hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
            printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
            scripts/hooks/commit-msg "$RUNNER_TEMP/title"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            exit 0
          fi
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/hooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
